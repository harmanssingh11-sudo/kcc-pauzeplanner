<!doctype html><html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>KCC • Inloggen</title><link rel="stylesheet" href="styles.css?v=20260825-auth"></head><body><header class="topbar"><div><div class="eyebrow">KCC</div><h1>Pauzeplanner</h1></div></header><main class="container authContainer"><section class="panel authPanel"><div class="panelhead"><div><h3 id="formTitle">Inloggen</h3><p id="formSub">Log in met het e-mailadres dat de planner voor je heeft toegevoegd.</p></div></div><form id="signinForm" class="portalForm authForm"><label>E-mailadres<input type="email" id="siEmail" required autocomplete="username"></label><label>Wachtwoord<input type="password" id="siPassword" required autocomplete="current-password"></label><label class="checkRow"><input type="checkbox" id="siRemember" checked> Onthoud mij op dit apparaat</label><button type="submit" class="primary">Inloggen</button></form><form id="signupForm" class="portalForm authForm" style="display:none"><label>E-mailadres<input type="email" id="suEmail" required autocomplete="username"></label><label>Wachtwoord (min. 8 tekens)<input type="password" id="suPassword" required minlength="8" autocomplete="new-password"></label><label>Herhaal wachtwoord<input type="password" id="suPassword2" required minlength="8" autocomplete="new-password"></label><button type="submit" class="primary">Account aanmaken</button></form><div id="authMsg" class="portalMsg"></div><div class="authLinks"><button type="button" class="linklike" id="toggleMode">Nog geen account? Account aanmaken</button><button type="button" class="linklike" id="forgotBtn">Wachtwoord vergeten?</button></div><form id="forgotForm" class="portalForm authForm" style="display:none"><label>E-mailadres<input type="email" id="fpEmail" required></label><button type="submit" class="secondary">Stuur reset-link</button></form></section></main><script src="./auth.js?v=20260825-auth"></script><script src="./login.js?v=20260825-auth"></script></body></html>
